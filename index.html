    <style>
      /* Preview-only: load Base's brand font so this demo host provides
         "PP Neue Montreal" the way the real Webflow site does. The component
         itself sets no font — it inherits from the host. Files live in the
         git-ignored demo-fonts/ dir and are not shipped or redistributed. */
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("/demo-fonts/PPNeueMontreal-Regular.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("/demo-fonts/PPNeueMontreal-Medium.woff2") format("woff2");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("/demo-fonts/PPNeueMontreal-SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "PP Neue Montreal", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .container {
        padding: 30vh 5vw 6vh 5vw;

        /* Add overflows and z-index because the marketing site does this too for many containers */
        overflow: hidden;
        position: relative;
        z-index: 1;
      }
      .dark {
        background-color: #2b2d42;
      }
      .light {
        background-color: #eee;
      }
    </style>
  </head>
  <body>
    <div class="container dark">
      <div style="max-width: 540px">
        <bpc-address-search
          public-key="%VITE_GOOGLE_MAPS_API_KEY%"
          cta="See if my home qualifies"
        ></bpc-address-search>
        <script>
          (() => {
            const el = document.currentScript.previousElementSibling;
            el.addEventListener("select", (e) =>
              console.log("select", e.detail),
            );
            el.addEventListener("result", (e) => {
              const url = new URL(
                e.detail.result.redirectUrl,
                window.location.origin,
              );
              url.searchParams.set("utm_source", "bpc-web-components");
              url.searchParams.set("utm_medium", "address-search");
              url.searchParams.set("utm_campaign", "bpc-web-components");

              // window.location.href = url.href;
              console.log("Would redirect to:", url.href);
            });
          })();
        </script>
      </div>
    </div>
    <div class="container dark" style="padding-top: 6vh">
      <div style="max-width: 540px">
        <!-- `mode="zip"` renders the zip-first entry. Its CTA defaults to
             "Check Availability"; the `cta` attribute overrides it (below). -->
        <bpc-address-search
          mode="zip"
          public-key="%VITE_GOOGLE_MAPS_API_KEY%"
          cta="See if my home qualifies"
        ></bpc-address-search>
        <script>
          (() => {
            const el = document.currentScript.previousElementSibling;
            el.addEventListener("result", (e) => {
              const url = new URL(
                e.detail.result.redirectUrl,
                window.location.origin,
              );
              url.searchParams.set("utm_source", "bpc-web-components");
              url.searchParams.set("utm_medium", "address-search");
              url.searchParams.set("utm_campaign", "bpc-web-components");

              // window.location.href = url.href;
              console.log("zip result", e.detail);
              console.log("Would redirect to:", url.href);
            });
            el.addEventListener("error", (e) =>
              console.log("zip error", e.detail),
            );
          })();
        </script>
      </div>
    </div>
    <!-- mode="zip-comed": experiment-gated (zip_entry_comed_0803). Renders nothing
         until flags resolve — zip entry for `test`, address entry otherwise. The
         switcher reloads because the arm is memoized per element and the flag is
         bootstrapped at posthog.init, before anything can read it. -->
    <div class="container light" style="padding-top: 6vh">
      <div style="max-width: 540px">
        <div
          style="
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 16px;
            font-size: 14px;
          "
        >
          <strong id="arm-state">arm: …</strong>
          <button type="button" data-arm="test">force test</button>
          <button type="button" data-arm="control">force control</button>
          <button type="button" data-arm="">clear</button>
        </div>
        <bpc-address-search
          mode="zip-comed"
          public-key="%VITE_GOOGLE_MAPS_API_KEY%"
          cta="See if my home qualifies"
        ></bpc-address-search>
        <script>
          (() => {
            // Listeners first: anything that throws below must not strand them.
            const el = document.currentScript.previousElementSibling;
            el.addEventListener("result", (e) => {
              const url = new URL(
                e.detail.result.redirectUrl,
                window.location.origin,
              );
              url.searchParams.set("utm_source", "bpc-web-components");
              url.searchParams.set("utm_medium", "address-search");
              url.searchParams.set("utm_campaign", "bpc-web-components");

              // window.location.href = url.href;
              console.log("zip-comed result", e.detail);
              console.log("Would redirect to:", url.href);
            });
            el.addEventListener("error", (e) =>
              console.log("zip-comed error", e.detail),
            );

            const STORE = "bpc_demo_arm";
            const forced = localStorage.getItem(STORE) || "";
            document.getElementById("arm-state").textContent = `arm: ${
              forced || "unassigned (no override)"
            }`;

            // The arm is bootstrapped at posthog.init in <head>, so switching it
            // is just localStorage plus a reload.
            for (const button of document.querySelectorAll("[data-arm]")) {
              button.addEventListener("click", () => {
                const arm = button.dataset.arm;
                if (arm) localStorage.setItem(STORE, arm);
                else localStorage.removeItem(STORE);
                location.reload();
              });
            }
          })();
        </script>
      </div>
    </div>
    <div class="container light">
      <div style="max-width: 540px">
        <bpc-address-search
          public-key="%VITE_GOOGLE_MAPS_API_KEY%"
        ></bpc-address-search>
        <script>
          (() => {
            const el = document.currentScript.previousElementSibling;
            el.addEventListener("select", (e) =>
              console.log("select", e.detail),
            );
            el.addEventListener("result", (e) =>
              console.log("result", e.detail),
            );
          })();
        </script>
      </div>
    </div>
    <div
      style="
        max-width: 540px;
        background-color: white;
        padding: 20px;
        z-index: 5;
        position: relative;
      "
    >
      This is a z-index test
    </div>
  </body>
</html>
